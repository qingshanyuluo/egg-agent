[package]
name = "egg-agent"
version = "0.1.5"
edition = "2024"

[[bin]]
name = "egg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which the UI
# uses as the single source of truth for wrapped-line height (see src/ui.rs
# `wrapped_height`). Pinned to a minor range because it's an unstable API.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
toml = "0.8"
dirs = "5"
inquire = "0.7"
unicode-width = "0.1"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
# HTML -> Markdown conversion for the web_fetch tool, so fetched pages arrive
# in a compact, LLM-friendly form (same idea as opencode's Turndown usage).
html2md = "0.2"
# Pure-Rust line diffing for the edit_file/write_file diff view in the
# transcript (feature A). Same crate the codex TUI uses.
similar = "2"
# Fuzzy matcher for @-file completion in the input box (feature D).
nucleo-matcher = "0.3"

[dev-dependencies]
tokio-test = "0.4"
