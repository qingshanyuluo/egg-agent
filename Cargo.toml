[package]
name = "egg-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "egg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
toml = "0.8"
dirs = "5"
inquire = "0.7"
unicode-width = "0.1"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tokio-test = "0.4"
