name: Release

on:
  push:
    tags:
      - "v*"

# action-gh-release needs write access to create the release and upload
# assets. Without this the default GITHUB_TOKEN is read-only and the upload
# step fails with "403 Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation deps (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        run: |
          cd target/${{ matrix.target }}/release
          tar czf egg-${{ matrix.target }}.tar.gz egg${{ matrix.suffix }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/egg-*.tar.gz
