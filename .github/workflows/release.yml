name: Release

on:
  push:
    tags:
      - "v*"

# action-gh-release needs write access to create the release and upload
# assets. Without this the default GITHUB_TOKEN is read-only and the upload
# step fails with "403 Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          # Cross-compile the Intel build on the Apple-Silicon runner: macOS's
          # clang targets x86_64 natively, and dedicated Intel runners
          # (macos-13) are scarce and queue for a long time.
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation deps (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Build
        # Point cargo at the cross linker for Linux aarch64; without this the
        # host x86-64 `cc` is used to link aarch64 objects and fails with
        # "incompatible with elf64-x86-64". Harmless for the other targets.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        run: |
          cd target/${{ matrix.target }}/release
          tar czf egg-${{ matrix.target }}.tar.gz egg${{ matrix.suffix }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/egg-*.tar.gz
